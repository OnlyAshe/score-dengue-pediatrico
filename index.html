<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score de complicaciones en dengue pediátrico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#16222b;--muted:#5d6d78;--line:#d8e0e6;--accent2:#1d6f9a;--low:#1f7a4d;--mid:#a86400;--high:#b3261e;--seg:#e2e8ec;--head:#12425e;--c2:#b3261e;--rc:var(--low);--shadow:0 1px 2px rgba(16,40,56,.06),0 10px 28px rgba(16,40,56,.08);--grad:linear-gradient(135deg,#1d6f9a,#168f87);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--surface:#16222b;--ink:#e8eef2;--muted:#9aabb6;--line:#2a3a46;--accent2:#6bb6e0;--low:#4cc38a;--mid:#f0b34a;--high:#ff8a80;--seg:#26363f;--head:#0b1217;--c2:#ff8a80;--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f171d;--surface:#16222b;--ink:#e8eef2;--muted:#9aabb6;--line:#2a3a46;--accent2:#6bb6e0;--low:#4cc38a;--mid:#f0b34a;--high:#ff8a80;--seg:#26363f;--head:#0b1217;--c2:#ff8a80;--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 88% -120px,rgba(29,111,154,.16),transparent),radial-gradient(700px 420px at -10% 30%,rgba(22,143,135,.09),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,.kpi b,.ring b,.facts b,.hero h2{font-family:"Manrope","IBM Plex Sans",system-ui,sans-serif}
header{background:linear-gradient(110deg,#07141d,#0f3a55 60%,#146b7a);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 0}
header>div,main{max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.brand h1{font-size:clamp(1.3rem,4vw,1.75rem);font-weight:800;margin:0;line-height:1.25;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:.85rem;opacity:.75}
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.tabs{display:inline-flex;max-width:100%;overflow-x:auto;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;margin-bottom:18px;backdrop-filter:blur(6px)}
.tabs button{margin:0;border:0;border-radius:999px;background:transparent;color:#fff;opacity:.8;padding:8px 16px;font-size:.88rem;white-space:nowrap;transition:background .2s,color .2s}
.tabs button:hover{opacity:1;background:rgba(255,255,255,.12);transform:none}
.tabs button[aria-selected=true]{background:#fff;color:#0e2a3b;opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.25)}
main{padding:24px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
h2{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;margin:0 0 16px}
h2::before{content:"";flex:none;width:4px;height:18px;border-radius:2px;background:var(--grad)}
h3{text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;font-weight:600;margin:20px 0 10px;color:var(--muted)}
.grid{display:grid;gap:16px}
@media(min-width:860px){.grid.two{grid-template-columns:1.25fr .75fr}.grid.eq{grid-template-columns:1fr 1fr}}
.sticky-res{position:sticky;top:16px;align-self:start}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}
.fbox{display:flex;flex-direction:column;gap:4px}
.fbox label{font-size:.84rem;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font-size:.75rem;color:var(--accent2);font-weight:600;white-space:nowrap}
.tag.opt{color:var(--muted);font-weight:400}
input[type=number],input[type=text],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 25%,transparent)}
button:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.cgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:.88rem;font-weight:500;transition:border-color .15s,background .15s;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent2);flex:none}
.check .tag{margin-left:auto}
.check:has(input:checked){border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--surface))}
.check.crit:has(input:checked){border-color:var(--high);background:color-mix(in srgb,var(--high) 10%,var(--surface))}
button{font:inherit;font-weight:500;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;margin:10px 8px 0 0;transition:transform .15s,box-shadow .15s,border-color .15s}
button:hover{transform:translateY(-1px);border-color:var(--accent2)}
button.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 16px rgba(22,120,140,.35)}
button.add{background:var(--low);border-color:var(--low);color:#fff}
button.sm{padding:5px 11px;font-size:.8rem;margin:0}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn-row button{margin:0}
.ringwrap{display:flex;justify-content:center;margin:4px 0 6px}
.ring{--p:0;width:154px;height:154px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--seg) 0);display:grid;place-items:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--rc) 10%,transparent)}
.ring>div{width:120px;height:120px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font-size:3rem;font-weight:800;color:var(--rc)}
.ring span{font-size:.76rem;color:var(--muted);margin-top:6px}
.bar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 6px}
.bar i{height:10px;border-radius:5px;background:var(--seg)}
.bar i.on{background:var(--rc)}
.mark{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:.75rem;color:var(--muted);text-align:center}
.verdict,.verdict.v-mid,.verdict.v-high{margin-top:14px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--rc) 35%,transparent);border-left:5px solid var(--rc);border-radius:12px;background:color-mix(in srgb,var(--rc) 9%,var(--surface))}
.verdict strong{display:block;color:var(--rc);font-size:1.05rem}
.verdict span{color:var(--muted);font-size:.88rem}
ul.parts{list-style:none;padding:0;margin:14px 0 0;font-size:.88rem}
ul.parts li{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);color:var(--muted)}
ul.parts li.y{color:var(--ink);font-weight:600}
.warn{font-size:.84rem;color:var(--mid);margin:10px 0 0;min-height:1.2em}
.okmsg{font-size:.84rem;color:var(--low);font-weight:600;margin:10px 0 0;min-height:1.2em}
.note{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));margin-bottom:6px}
.facts div{border-radius:12px;background:var(--bg);padding:12px 14px}
.facts b{display:block;font-size:1.35rem;font-weight:800}
.facts span{font-size:.78rem;color:var(--muted)}
.scroll{overflow-x:auto;max-height:440px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:420px}
th{font-weight:600;color:var(--muted);font-size:.76rem;position:sticky;top:0;background:var(--bg);z-index:1;white-space:nowrap}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
tbody tr.sel td{background:color-mix(in srgb,var(--accent2) 15%,var(--surface));font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.76rem;font-weight:500;color:#fff}
.p-low{background:var(--low)}.p-mid{background:var(--mid)}.p-high{background:var(--high)}
.m{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.m i{display:block;height
