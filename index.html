<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score de complicaciones en dengue pediátrico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#16222b;--muted:#5d6d78;--line:#d8e0e6;--accent2:#1d6f9a;--low:#1f7a4d;--mid:#a86400;--high:#b3261e;--seg:#e2e8ec;--head:#12425e;--c2:#b3261e;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--surface:#16222b;--ink:#e8eef2;--muted:#9aabb6;--line:#2a3a46;--accent2:#6bb6e0;--low:#4cc38a;--mid:#f0b34a;--high:#ff8a80;--seg:#26363f;--head:#0b1217;--c2:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f171d;--surface:#16222b;--ink:#e8eef2;--muted:#9aabb6;--line:#2a3a46;--accent2:#6bb6e0;--low:#4cc38a;--mid:#f0b34a;--high:#ff8a80;--seg:#26363f;--head:#0b1217;--c2:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--head);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 0}
header>div,main{max-width:980px;margin:0 auto}
h1{font-size:clamp(1.3rem,4vw,1.75rem);font-weight:600;margin:0;line-height:1.25}
header p{margin:6px 0 14px;font-size:.9rem;opacity:.8}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{margin:0;border:0;border-radius:4px 4px 0 0;background:transparent;color:#fff;opacity:.7;padding:10px 16px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:20px 16px 40px}
h2{font-size:.95rem;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h3{font-size:.85rem;font-weight:600;margin:20px 0 8px;color:var(--muted)}
.grid{display:grid;gap:16px}
@media(min-width:780px){.grid.two{grid-template-columns:1.1fr .9fr}.grid.eq{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px}
.field{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin-bottom:14px}
.field label{font-weight:500}
.tag{font-size:.82rem;color:var(--muted);text-align:right}
.field input{grid-column:1/-1}
input[type=number],select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.check{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent2)}
.check .tag{margin-left:auto;font-weight:400}
button{font:inherit;font-weight:500;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;margin:12px 8px 0 0}
button.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:4rem;font-weight:600;line-height:1}
.score span{color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:14px 0 6px}
.bar i{height:14px;background:var(--seg)}
.bar i.on{background:var(--accent2)}
.mark{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:.75rem;color:var(--muted);text-align:center}
.verdict{margin-top:16px;padding:12px 14px;border-left:4px solid var(--low);background:var(--bg)}
.verdict strong{display:block}
.v-mid{border-color:var(--mid)}.v-high{border-color:var(--high)}
.verdict span{color:var(--muted);font-size:.9rem}
ul.parts{list-style:none;padding:0;margin:14px 0 0;font-size:.9rem}
ul.parts li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted)}
ul.parts li.y{color:var(--ink);font-weight:600}
.warn{font-size:.82rem;color:var(--mid);margin:10px 0 0;min-height:1.2em}
.note{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:6px}
.facts div{border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.facts b{display:block;font-size:1.35rem;font-weight:600}
.facts span{font-size:.78rem;color:var(--muted)}
.scroll{overflow-x:auto;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:380px}
th{font-weight:600;color:var(--muted);font-size:.78rem;position:sticky;top:0;background:var(--surface)}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--bg);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.78rem;color:#fff}
